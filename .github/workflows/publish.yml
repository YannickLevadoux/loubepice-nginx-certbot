name: Publish immutable image

on:
  push:
    tags:
      - v1.2.0

permissions:
  contents: read

concurrency:
  group: publish-nginx-certbot-1.2.0
  cancel-in-progress: false

env:
  IMAGE_REF: docker.io/yannick7fr/nginx-certbot-custom:1.2.0

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce the immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = v1.2.0
          test "$(git tag --points-at HEAD --list v1.2.0)" = v1.2.0

      - name: Refuse an existing Docker Hub version
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image $IMAGE_REF" >&2
            exit 1
          fi

      - name: Require Docker Hub publication secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured.' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build publication candidate locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            SOURCE_DATE_EPOCH=1766416952
            SOURCE_REVISION=${{ github.sha }}

      - name: Test publication candidate
        run: bash tests/test-image.sh "$IMAGE_REF"

      - name: Scan publication candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          vuln-type: os,library
          format: table
          exit-code: '0'

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish only version 1.2.0
        shell: bash
        run: docker push "$IMAGE_REF"

      - name: Record Docker Hub digest
        shell: bash
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE_REF" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve the published digest: $digest" >&2
            exit 1
          fi
          immutable_ref="yannick7fr/nginx-certbot-custom@$digest"
          printf '%s\n' "$immutable_ref" | tee published-digest.txt
          printf '## Published image\n\n`%s`\n' "$immutable_ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload published digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-digest-1.2.0
          path: published-digest.txt
          retention-days: 90
